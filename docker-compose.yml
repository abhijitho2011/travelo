services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: travelo
      POSTGRES_PASSWORD: travelo
      POSTGRES_DB: travelo_admin
    ports: ['5432:5432']
    volumes:
      - travelo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U travelo']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://travelo:travelo@postgres:5432/travelo_admin
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-me-please-32chars
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me-please-32chars
      SEED_SUPER_ADMIN_EMAIL: admin@travelo.local
      SEED_SUPER_ADMIN_PASSWORD: ChangeMe!12345
    ports: ['3000:3000']

volumes:
  travelo_pg:
